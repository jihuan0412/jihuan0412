<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유튜브 채널 운영 타이쿤</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --card2: #222632; --line: #2c3140; --text: #e9ecf2; --mute: #8b93a7;
    --red: #ff4b4b; --green: #3ccf7a; --yellow: #ffcc4d; --blue: #4da3ff; --purple: #b28cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; font-size: 15px; }
  body { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 76px; }
  button { font: inherit; color: inherit; border: 0; border-radius: 10px; padding: 9px 12px; background: var(--card2); cursor: pointer; touch-action: manipulation; }
  button.primary { background: var(--red); color: #fff; font-weight: 700; }
  button.ok { background: var(--green); color: #06150c; font-weight: 700; }
  button.ghost { background: transparent; border: 1px solid var(--line); }
  button:disabled { opacity: .38; cursor: default; }
  .top { position: sticky; top: 0; z-index: 5; background: rgba(15,17,21,.96); backdrop-filter: blur(6px); padding: 10px 12px 8px; border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .ch { font-weight: 800; font-size: 16px; }
  .date { color: var(--mute); font-size: 12px; white-space: nowrap; }
  .speeds { flex-shrink: 0; gap: 4px; }
  .speeds button { padding: 5px 8px; font-size: 13px; white-space: nowrap; }
  .speeds button.on { background: var(--blue); color: #001; font-weight: 700; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
  .stat { background: var(--card); border-radius: 10px; padding: 6px 8px; }
  .stat .k { font-size: 11px; color: var(--mute); }
  .stat .v { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 7px; background: #2a2f3b; border-radius: 6px; overflow: hidden; margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--green); border-radius: 6px; }
  .bar.big { height: 12px; }
  body.playing { overflow: hidden; height: 100dvh; padding: 0; }
  #scene { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); height: 100dvh; image-rendering: pixelated; background: transparent; touch-action: manipulation; cursor: pointer; }
  body.playing #scene, body.starting #scene { display: block; }
  .startwrap { position: fixed; inset: 0; z-index: 20; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
  .logo { pointer-events: none; text-align: center; padding: calc(28px + env(safe-area-inset-top)) 16px 0; }
  .logo .t1 { font-size: 15px; font-weight: 800; letter-spacing: 4px; color: #ffe066; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .logo .t2 { font-size: 34px; font-weight: 900; line-height: 1.1; color: #fff; text-shadow: 0 3px 0 #e5484d, 0 6px 18px rgba(0,0,0,.55); margin-top: 4px; }
  .logo .t3 { font-size: 13px; color: #fff; opacity: .9; margin-top: 8px; text-shadow: 0 1px 4px #000; }
  .spanel { pointer-events: auto; background: rgba(16,19,27,.94); backdrop-filter: blur(8px); border-radius: 22px 22px 0 0; padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); max-height: 58dvh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,.5); width: min(100vw, 480px); margin: 0 auto; animation: sup .35s ease-out; }
  @keyframes sup { from { transform: translateY(40px); opacity: 0; } }
  .steps { display: flex; gap: 6px; justify-content: center; margin-bottom: 10px; }
  .steps i { width: 26px; height: 5px; border-radius: 9px; background: #343a4a; }
  .steps i.on { background: #ff5a5a; }
  .sp-title { font-size: 18px; font-weight: 800; margin: 2px 0 10px; }
  .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rcard { text-align: left; padding: 12px; border-radius: 14px; background: #1f2431; border: 2px solid transparent; }
  .rcard.sel { border-color: #ff5a5a; background: #2a2230; }
  .rcard .ic { font-size: 28px; }
  .rcard b { display: block; font-size: 16px; margin: 2px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: #2c3242; color: #cfd5e2; }
  .navrow { display: flex; gap: 8px; margin-top: 12px; }
  .navrow button { flex: 1; padding: 13px; font-weight: 800; }
  .bigstart { width: 100%; padding: 16px; font-size: 18px; font-weight: 900; border-radius: 16px; background: linear-gradient(180deg,#ff6a6a,#e23a3a); color: #fff; box-shadow: 0 6px 18px rgba(226,58,58,.45); animation: pulse 1.6s ease-in-out infinite; }
  .movefx { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(10,12,20,.82); animation: mfin .3s ease-out; pointer-events: none; }
  .movefx.out { animation: mfout .5s ease-in forwards; }
  @keyframes mfin { from { opacity: 0; } } @keyframes mfout { to { opacity: 0; } }
  .movefx .box { width: min(92vw, 420px); text-align: center; color: #fff; }
  .movefx .road { position: relative; height: 70px; margin: 16px 0; border-radius: 12px; background: linear-gradient(180deg,#3b3f4a 0 45%,#2e323b 45%); overflow: hidden; }
  .movefx .road:after { content: ""; position: absolute; left: 0; right: 0; top: 52px; height: 3px; background: repeating-linear-gradient(90deg,#f2d14a 0 22px,transparent 22px 40px); }
  .movefx .truck { position: absolute; top: 4px; font-size: 44px; transform: scaleX(-1); animation: drive 2.4s ease-in-out forwards; }
  @keyframes drive { from { left: -60px; } to { left: calc(100% + 10px); } }
  .movefx .pl { display: flex; justify-content: space-between; font-weight: 800; }
  .movefx .pl span { font-size: 13px; opacity: .85; }
  body.playing { background: radial-gradient(120% 70% at 50% 55%, #2a3350 0%, #151a2a 55%, #0b0d14 100%); }
  .hud { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: min(100vw, 480px); padding: calc(8px + env(safe-area-inset-top)) 10px 10px; z-index: 5; pointer-events: none;
    background: linear-gradient(180deg, rgba(8,10,16,.82) 0%, rgba(8,10,16,.55) 70%, rgba(8,10,16,0) 100%); }
  .hud button, .hud .stat { pointer-events: auto; }
  .hud .ch { text-shadow: 0 1px 2px #000; }
  .pills { display: grid; grid-template-columns: 1.25fr 1fr 1.1fr .8fr; gap: 5px; margin-top: 7px; }
  .pill { pointer-events: auto; display: flex; align-items: center; gap: 4px; background: rgba(14,17,24,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 99px; padding: 5px 9px; font-size: 13px; white-space: nowrap; overflow: hidden; }
  .pill .bar { flex: 1; margin: 0; height: 6px; }
  .hud .stat { background: rgba(14,17,24,.72); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(4px); }
  .status { position: fixed; left: 50%; transform: translateX(-50%); width: min(calc(100vw - 20px), 460px); z-index: 4; display: none; }
  body.playing .status { display: block; }
  body.playing.sheet-open .status { display: none; }
  body.sheet-open .toasts { bottom: calc(48dvh + 74px); }
  body.sheet-full .toasts { bottom: 80px; }
  .scard { background: rgba(14,17,24,.82); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 8px 10px; backdrop-filter: blur(4px); font-size: 13px; }
  .scard .bar { margin-top: 5px; }
  .qline { display: inline-block; margin-top: 4px; font-size: 12px; padding: 2px 8px; border-radius: 99px; background: rgba(14,17,24,.7); color: #cfd5e2; }
  .qline span { color: var(--yellow); }
  .cta { width: 100%; padding: 9px; font-weight: 800; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.4); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.03); } }
  .sheet { position: fixed; left: 50%; bottom: calc(64px + env(safe-area-inset-bottom)); width: min(100vw, 480px); max-height: 56dvh; z-index: 7; background: #141821; border-radius: 18px 18px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.55);
    transform: translate(-50%, calc(100% + 90px)); visibility: hidden; overflow: hidden; transition: transform .22s ease-out, visibility 0s .22s; display: flex; flex-direction: column; }
  .sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .22s ease-out; }
  .sheet.full { max-height: calc(100dvh - 64px - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 6px); height: calc(100dvh - 64px - env(safe-area-inset-bottom) - env(safe-area-inset-top) - 6px); }
  .sheet { max-height: 48dvh; transition: transform .22s ease-out, max-height .2s ease-out, height .2s ease-out, visibility 0s .22s; }
  .grab { display: block; width: 42px; height: 5px; border-radius: 9px; background: #4a5164; margin: 7px auto 0; }
  .sheet-head .hb { display: flex; gap: 6px; }
  .lifebar { pointer-events: auto; display: flex; gap: 5px; margin-top: 5px; align-items: center; cursor: pointer; }
  .lb { flex: 1; display: flex; align-items: center; gap: 4px; background: rgba(14,17,24,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 99px; padding: 3px 8px; font-size: 12px; white-space: nowrap; }
  .lb .bar { flex: 1; margin: 0; height: 5px; }
  .cond { flex: 0 0 auto; font-weight: 800; }
  .lb.low { border-color: rgba(255,90,90,.6); animation: pulse 1.4s ease-in-out infinite; }
  .needrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .needrow .bar { flex: 1; margin: 0; }
  .lact { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .lact:last-child { border-bottom: 0; }
  .lact .ic2 { font-size: 26px; width: 34px; text-align: center; }
  .lact .tx { flex: 1; min-width: 0; }
  .lact button { min-width: 84px; white-space: nowrap; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 6px; border-bottom: 1px solid var(--line); }
  .sheet-head b { font-size: 16px; }
  .sheet-head .x { padding: 4px 10px; }
  .sheet main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 10px 12px 14px; }
  main { padding: 12px; }
  .card { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
  .card h3 { margin: 0 0 8px; font-size: 15px; }
  .mute { color: var(--mute); font-size: 13px; }
  .small { font-size: 12px; }
  .tag { white-space: nowrap; display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--card2); color: var(--mute); margin-right: 4px; }
  .tag.hot { background: #3a1616; color: #ff8a8a; }
  .tag.good { background: #12301f; color: var(--green); }
  .tag.warn { background: #33290f; color: var(--yellow); }
  .tapbtn { width: 100%; padding: 18px; font-size: 18px; font-weight: 800; background: linear-gradient(180deg, #ff5d5d, #e23a3a); color: #fff; border-radius: 14px; margin-top: 10px; user-select: none; }
  .tapbtn:active { transform: scale(.97); }
  .stage { margin: 6px 0; }
  .stage .row { font-size: 13px; }
  .trend { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
  .trend .t { font-weight: 700; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .thumb { background: var(--card2); border-radius: 10px; padding: 10px 6px; text-align: center; border: 1px solid var(--line); }
  .thumb b { display: block; font-size: 18px; margin: 4px 0; }
  .item { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .item .name { font-weight: 700; }
  .item button { min-width: 96px; white-space: nowrap; }
  .segs { display: flex; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); flex-shrink: 0; }
  .segs .seg { min-width: 0; padding: 7px 10px; border-radius: 0; background: transparent; font-size: 13px; }
  .segs .seg.on { background: var(--blue); color: #001; font-weight: 800; }
  .catrow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .seg2 { flex-shrink: 0; padding: 6px 11px; border-radius: 99px; font-size: 13px; background: var(--card2); border: 1px solid var(--line); }
  .seg2.on { background: var(--blue); color: #001; font-weight: 800; border-color: var(--blue); }
  #placebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(74px + env(safe-area-inset-bottom)); width: min(calc(100vw - 20px), 460px); z-index: 8; background: rgba(14,17,24,.94); border: 1px solid rgba(255,255,255,.12); border-radius: 14px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #placebar .pb-t { font-size: 13px; font-weight: 700; }
  #placebar button { padding: 7px 11px; }
  .mood { display: inline-block; width: 46px; height: 6px; border-radius: 6px; background: #2a2f3b; overflow: hidden; vertical-align: middle; }
  .mood i { display: block; height: 100%; }
  .vid { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .vid:last-child { border-bottom: 0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .kv { background: var(--card2); border-radius: 10px; padding: 8px; }
  .kv .k { font-size: 11px; color: var(--mute); }
  .kv .v { font-weight: 800; }
  .switch { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
  .tg { width: 46px; height: 26px; border-radius: 99px; background: #3a3f4d; position: relative; padding: 0; }
  .tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: left .15s; }
  .tg.on { background: var(--green); }
  .tg.on::after { left: 23px; }
  .tabs { height: calc(64px + env(safe-area-inset-bottom)); position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(7, 1fr); background: rgba(14,17,24,.94); backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 6; }
  .tabs button { background: transparent; border-radius: 0; padding: 10px 0 12px; font-size: 11px; color: var(--mute); white-space: nowrap; }
  .tabs button .ic { display: block; font-size: 19px; }
  .tabs button.on { color: var(--text); font-weight: 700; }
  .tabs .dot { display: inline-block; width: 7px; height: 7px; background: var(--red); border-radius: 50%; margin-left: 2px; vertical-align: top; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
  .modal { background: var(--card); border-radius: 16px; padding: 16px; width: 100%; max-width: 420px; max-height: 90vh; overflow: auto; }
  .modal h2 { margin: 0 0 8px; font-size: 18px; }
  .modal .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .modal .choices button { text-align: left; padding: 12px; }
  .opt { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: var(--card2); text-align: left; width: 100%; }
  .opt.sel { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue) inset; }
  input[type=text] { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font: inherit; }
  .toasts { position: fixed; bottom: 150px; left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 456px; z-index: 15; pointer-events: none; display: flex; flex-direction: column-reverse; gap: 6px; }
  .toast { background: #262b37; border-left: 4px solid var(--blue); padding: 8px 10px; border-radius: 8px; font-size: 13px; animation: tin .2s ease-out; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .toast.good { border-color: var(--green); }
  .toast.bad { border-color: var(--red); }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
  .float { position: fixed; pointer-events: none; font-weight: 800; color: var(--yellow); animation: up .7s ease-out forwards; z-index: 30; }
  @keyframes up { to { transform: translateY(-40px); opacity: 0; } }
  .mock { background: #33290f; color: var(--yellow); border-radius: 10px; padding: 8px 10px; font-size: 12px; margin-bottom: 10px; }
  .price { font-weight: 800; color: var(--yellow); }
  .log { font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .log.good { color: #9ff0c2; } .log.bad { color: #ff9c9c; }
</style>
</head>
<body>

<script>
'use strict';
const E = window.Engine, C = E.CONFIG, fmt = E.fmt;
const BRANDS = JSON.parse(document.getElementById('brands').textContent);
const SAVE_KEY = 'ytTycoon.v1';
const NGP_KEY = 'ytTycoon.ngp';
let lowGfx = localStorage.getItem('ytTycoon.lowgfx') === '1';

let S = null;            // 게임 상태
let tab = null;            // 열린 아래 창 (null = 닫힘)
const FULL_TABS = ['team', 'invest', 'shop', 'myhome', 'channel', 'log'];
let sheetFull = false, lifeFocus = null;
const SHEET_TITLES = { life: '🍚 생활', myhome: '🏡 미니홈', team: '🤖 AI·팀', home: '🏠 집', make: '🎬 제작', channel: '📊 채널', invest: '🛒 투자', shop: '🎁 상점', log: '📜 기록' };
let speedIdx = 0;
let paused = false;
let modal = null;        // { type, ... }
let lastMainHtml = '', lastTopHtml = '', lastTabsHtml = '', lastModalHtml = '';
let startSel = { trait: 'planner', pack: 'free', channel: '', step: 0, region: 'city', house: 'gosiwon', genre: 'info' };

// ───────── 저장 ─────────
function save() {
  if (!S) return;
  const o = Object.assign({}, S); delete o.rng; o._toasts = [];
  o.savedAt = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(o)); } catch (e) {}
}
function load() {
  try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; }
}

// ───────── 보조 ─────────
const won = n => '₩' + fmt(n);
const pct = x => Math.round(x * 100) + '%';
function effText(t) {
  const a = [];
  if (t.q) a.push(`품질 +${t.q}`);
  if (t.plan) a.push(`기획 시간 -${pct(t.plan)}`);
  if (t.shoot) a.push(`촬영 시간 -${pct(t.shoot)}`);
  if (t.edit) a.push(`편집 시간 -${pct(t.edit)}`);
  if (t.thumb) a.push(`썸네일 실력 +${t.thumb}`);
  if (t.seo) a.push(`검색 최적화 +${t.seo}`);
  if (t.regen) a.push(`휴식 회복 +${t.regen}`);
  return a.join(', ');
}
function itemName(k, i) { return BRANDS[E.EQUIP[k].tiers[i].slot] || E.EQUIP[k].tiers[i].slot; }
function nextQuest() { return E.QUESTS.find(q => !S.quests[q.id]); }
function packValue(p) {
  let v = 0;
  if (p.give.equip) for (const k in p.give.equip) for (let i = 1; i <= p.give.equip[k]; i++) v += E.EQUIP[k].tiers[i].price;
  if (p.give.routine) v += E.ROUTINE_PRICE;
  return v;
}

  h += `<div class="switch"><div><b>편집 외주</b><div class="mute small">편당 ${won(C.outsourceEdit.cost)} · 편집 단계 체력 소모 0, 시간 -30%</div></div><button class="tg ${S.routine.outsource ? 'on' : ''}" data-a="outsource"></button></div></div>`;

function houseCard(id, cur) {
  const H = E.HOUSES[id], f = H.furnished || {};
  const furn = Object.keys(f).map(k => itemName(k, f[k])).join(', ');
  const eff = [H.q ? `품질 ${H.q > 0 ? '+' : ''}${H.q}` : '', H.regen ? `휴식 회복 ${H.regen > 0 ? '+' : ''}${H.regen}` : '', H.staff ? `책상 ${H.staff + 1}개` : ''].filter(Boolean).join(' · ');
  const cm = E.canMove(S, id);
  let btn;
  if (cur) btn = '<span class="tag good">지금 사는 곳</span>';
  else btn = `<button class="ok" data-a="move" data-k="${id}" ${cm.ok ? '' : 'disabled'}>${won(E.moveCost(S, id))}</button>`;
  return `<div class="item"><div><div class="name">${E.REGIONS[H.region].icon} ${H.name} <span class="mute small">월세 ${H.rent ? won(H.rent) : '없음'}</span></div>
    <div class="mute small">${H.desc}${furn ? ` · 가구: ${furn}` : ''}${eff ? ` · ${eff}` : ''}</div>
    ${!cur && !cm.ok && cm.why ? `<div class="small" style="color:var(--yellow)">${cm.why}</div>` : ''}</div>${btn}</div>`;
}
function renderHome() {

    <div class="kv"><div class="k">다음 월세까지</div><div class="v">${Math.max(0, Math.ceil((S.nextRentGh - S.gh) / 24))}일</div></div></div>

  h += `<div class="card"><h3>🏠 ${Rg.name}의 집</h3><div class="mute small" style="margin-bottom:4px">이사하면 ${E.MOVE_DAYS}일 동안 영상을 못 만듭니다. 집에 딸린 가구는 두고 갑니다.</div>`;

function renderStatus() {
  const j = S.job, burnt = S.gh < S.burnoutUntil;
  let h = '';
  if (burnt) h = `<div class="scard">🛌 번아웃 강제 휴식 · ${Math.ceil((S.burnoutUntil - S.gh) / 24)}일 남음</div>`;
  else if (S.live) h = `<div class="scard">🔴 라이브 방송 중 · 슈퍼챗이 쌓이는 중<div class="bar"><i style="width:${(1 - S.live.left / 24) * 100}%;background:var(--red)"></i></div></div>`;
  else if (S.moving) { const m = S.moving; h = `<div class="scard">🚚 ${E.HOUSES[m.to].name}(으)로 이사 중 · ${Math.max(0, Math.ceil((m.untilGh - S.gh) / 24))}일 남음<div class="bar"><i style="width:${(S.gh - m.startGh) / (m.untilGh - m.startGh) * 100}%"></i></div></div>`; }
  else if (j && j.partTime) h = `<div class="scard">🏪 알바 중 · 끝나면 ${won(E.partPay(S))}<div class="bar"><i style="width:${(1 - j.left / C.partTime.hours) * 100}%"></i></div></div>`;
  else if (S.life && S.life.act && !(j && (j.how || [])[j.stage] !== 'self')) { const A = E.LIFE_ACTS[S.life.act.id]; h = `<div class="scard">${A.icon} ${A.name} 중${j ? ' · 작업 잠깐 멈춤' : ''}<div class="bar"><i style="width:${(1 - S.life.act.left / S.life.act.total) * 100}%;background:var(--yellow)"></i></div></div>`; }
  else if (j) {
    const total = C.stages.reduce((a, _, i) => a + E.stageHours(S, i), 0);
    let done = 0; for (let i = 0; i < j.stage; i++) done += E.stageHours(S, i); done += E.stageHours(S, j.stage) * j.progress;
    const who = { self: '', ai: ' 🤖AI', staff: ' 👤직원' }[(j.how || [])[j.stage] || 'self'];
    const hint = (!S.routine.on && (S.stats_videos || 0) < 3 ? ' · 👆 방을 연타하면 빨라져요' : '') ;
    h = `<div class="scard"><div class="row between"><b style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">🎬 ${esc(j.card.topic)}</b><span class="mute small" style="white-space:nowrap">${C.stages[j.stage].name}${who} ${j.stage + 1}/3${hint}</span></div><div class="bar"><i style="width:${done / total * 100}%"></i></div></div>`;
  } else if (S.uploadReady) h = `<button class="cta primary" data-a="tab" data-k="make">📤 업로드할 썸네일 고르기</button>`;
  else if (S.resting) h = `<div class="scard row between"><span>😴 휴식 중 · 체력 ${Math.round(S.stamina)}/${E.maxStamina(S)}</span><button data-a="wake" style="padding:4px 10px">그만 쉬기</button></div>`;
  else if (S.routine.on) h = `<div class="scard">⚙️ 자동 루틴 작동 중 — 놔둬도 영상이 나옵니다</div>`;
  else if (!S.pendingEvent) h = `<button class="cta primary" data-a="tab" data-k="make">🎬 새 영상 만들기</button>`;
  const q = nextQuest();
  if (q) h += `<div class="qline">🎯 ${q.text} <span>· ${won(q.reward)}</span></div>`;
  return h;
}

    const ae = document.activeElement, typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA') && document.getElementById('main').contains(ae);

let down = null;
document.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, head: !!e.target.closest('.sheet-head, .grab') };
  const b = e.target.closest('[data-a="tap"]');
  if (b && !b.disabled) { doTap(e); down = null; return; }
  if (window.HomeUI) HomeUI.firstGesture();
  if (e.target.id === 'scene' && window.HomeUI && (HomeUI.placing || HomeUI.editing)) { HomeUI.scenePointer('down', e); return; }
  if (e.target.id === 'scene' && tab) { tab = null; down = null; render(); return; }
  if (e.target.id === 'scene' && S && Scene.pickSpot) {
    const sp = Scene.pickSpot(e.clientX, e.clientY);
    if (sp) { tab = 'life'; lifeFocus = sp; sheetFull = false; lastMainHtml = ''; document.getElementById('main').scrollTop = 0; down = null; render(); return; }
  }
  if (e.target.id === 'scene' && S && S.job && !S.job.partTime) { const p = Scene.toLogical(e.clientX, e.clientY); if (E.tap(S)) Scene.tapFx(p.x, p.y); down = null; }
});
document.addEventListener('pointermove', e => { if (window.HomeUI && HomeUI.placing && e.target.id === 'scene' && Scene.placementPointer) Scene.placementPointer(e.clientX, e.clientY); });
document.addEventListener('pointerup', e => {
  if (e.target.id === 'scene' && window.HomeUI && (HomeUI.placing || HomeUI.editing) && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 12) { down = null; HomeUI.scenePointer('up', e); render(); return; }
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dy = e.clientY - down.y, head = down.head;
  down = null;
  if (head && tab && Math.abs(dy) > 40) {   // 창 머리를 위로 끌면 전체 화면, 아래로 끌면 반 화면 → 닫기
    if (dy < 0) sheetFull = true; else if (sheetFull) sheetFull = false; else tab = null;
    render(); return;
  }
  if (moved > 12) return;
  const b = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-a]');
  if (!b || b.disabled) return;
  act(b.dataset.a, b.dataset);
});
document.addEventListener('pointercancel', () => { down = null; });

function doTap(e) {
  if (E.tap(S)) {
    const f = document.createElement('div'); f.className = 'float'; f.textContent = '+' + C.tapHours + 'h';
    f.style.left = (e.clientX - 14) + 'px'; f.style.top = (e.clientY - 20) + 'px';
    document.body.appendChild(f); setTimeout(() => f.remove(), 700);
    render();
  }

function act(a, d) {
  const i = d.i !== undefined ? +d.i : null, k = d.k;
  switch (a) {
    case 'tab': tab = tab === k ? null : k; if (tab !== 'life') lifeFocus = null; sheetFull = FULL_TABS.includes(tab); lastMainHtml = ''; document.getElementById('main').scrollTop = 0; if (tab && window.HomeUI) HomeUI.onTabOpen(tab); break;
    case 'sheetsize': sheetFull = !sheetFull; break;
    case 'life': E.lifeAct(S, k); if (E.LIFE_ACTS[k].hours) tab = null; break;
    case 'svc': E.buyService(S, k); break;
    case 'svcstop': E.stopService(S, k); break;
    default: if (window.HomeUI) HomeUI.act(a, d); break;
    case 'closesheet': tab = null; break;
    case 'speed': speedIdx = i; paused = false; break;
    case 'pause': paused = !paused; break;
    case 'start': if (E.startVideo(S, i)) tab = null; break;
    case 'upload': E.upload(S, i); tab = null; break;
    case 'rest': if (E.canWork(S)) S.resting = true; break;
    case 'wake': S.resting = false; break;
    case 'part': E.partTime(S); break;
    case 'routine': S.routine.on = !S.routine.on; break;
    case 'outsource': S.routine.outsource = !S.routine.outsource; break;
    case 'buyroutine': E.buyRoutine(S); break;
    case 'equip': E.buyEquip(S, k); break;
    case 'pipe': E.setPipeline(S, i, k); break;
    case 'aiplan': E.setAIPlan(S, i); break;
    case 'ailabel': S.ai.label = !S.ai.label; break;
    case 'hire': E.hire(S, i); break;
    case 'fire': E.fire(S, i); break;
    case 'live': if (E.startLive(S)) tab = null; break;
    case 'goods': E.makeGoods(S); break;
    case 'model': E.trainModel(S); break;
    case 'lowgfx': lowGfx = !lowGfx; localStorage.setItem('ytTycoon.lowgfx', lowGfx ? '1' : '0'); Scene.setLowGfx && Scene.setLowGfx(lowGfx); break;
    case 'mcn': E.foundMCN(S); break;
    case 'sign': E.signCreator(S, i); break;
    case 'ngp': {
      const prev = JSON.parse(localStorage.getItem(NGP_KEY) || '{}');
      const ngp = { aiMade: S.ai.made, count: (prev.count || 0) + 1, endings: (prev.endings || []).concat([S.ended.type]) };
      localStorage.setItem(NGP_KEY, JSON.stringify(ngp)); localStorage.removeItem(SAVE_KEY);

    case 'move': if (E.moveHouse(S, k)) { tab = null; if (window.MoveFx) MoveFx.play(S); } break;
    case 'skill': E.buySkill(S, k); break;
    case 'pack': modal = { type: 'confirmPack', id: k }; break;
    case 'confirmpack': E.applyPack(S, modal.id); modal = null; break;
    case 'event': E.resolveEvent(S, i); break;
    case 'closemodal': modal = null; break;
    case 'reset': modal = { type: 'reset' }; break;
    case 'confirmreset': localStorage.removeItem(SAVE_KEY); S = null; modal = null; startSel = { trait: 'planner', pack: 'free', channel: '', step: 0, region: 'city', house: 'gosiwon', genre: 'info' }; lastMainHtml = lastTopHtml = lastTabsHtml = lastStatusHtml = ''; tab = null; document.getElementById('status').innerHTML = ''; document.getElementById('main').innerHTML = ''; document.getElementById('top').innerHTML = ''; document.getElementById('tabs').innerHTML = ''; break;
    case 'selpack': startSel.pack = k; previewState = null; break;
    case 'sstep': { const nm = document.getElementById('chname'); if (nm) startSel.channel = nm.value; startSel.step = i; if (i >= 2 && (!startSel.house || E.HOUSES[startSel.house].region !== startSel.region)) startSel.house = E.housesOf(startSel.region)[0]; break; }
    case 'sregion': startSel.region = k; startSel.house = E.housesOf(k)[0]; break;

}

// ───────── 게임 루프 ─────────
let lastT = performance.now(), saveAcc = 0, renderAcc = 0;
function loop(now) {
  let dt = (now - lastT) / 1000; lastT = now;
  if (dt > 30 && S) { const o = E.offline(S, dt); if (o) modal = { type: 'offline', data: o }; dt = 0; }
  dt = Math.min(dt, 0.25);
  if (S && !paused && !modal) {
    E.advance(S, dt * C.speeds[speedIdx] * E.ghPerRealSec(), dt);
  }
  if (S) Scene.frame(S, paused || modal ? 0 : dt, C.speeds[speedIdx]);
  else if (previewState) { previewState.gh += dt * 1.2; Scene.frame(null, dt, 1); }
  saveAcc += dt; renderAcc += dt;
  if (saveAcc > 5) { saveAcc = 0; save(); if (window.HomeUI) HomeUI.tick(); }
  if (renderAcc > 0.12) { renderAcc = 0; render(); }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
window.addEventListener('beforeunload', save);
